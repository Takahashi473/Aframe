<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>カラフルな家 - A-Frame</title>
<meta name="description" content="A-Frameで作ったカラフルな3Dの家">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #87CEEB">
  <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#7BC8A4" shadow></a-plane>

 
  <a-entity position="0 0 -4" rotation="0 -25 0">
    
    
    <a-box position="0 0.75 0" width="2" height="1.5" depth="1.6" color="#FFD166" shadow></a-box>

  
    <a-box position="-0.45 0.45 0.81" width="0.5" height="0.9" depth="0.05" color="#EF476F" shadow></a-box>
   
    <a-sphere position="-0.3 0.45 0.85" radius="0.04" color="#FFF"></a-sphere>

    <a-box position="0.45 0.85 0.81" width="0.55" height="0.55" depth="0.05" color="#FFFFFF" shadow></a-box>
    <a-box position="0.45 0.85 0.82" width="0.43" height="0.43" depth="0.05" color="#4CC9F0"></a-box>


    <a-box position="0 1.65 0" width="2.4" height="0.45" depth="1.9" color="#F77F00" shadow></a-box>

    <a-box position="-0.6 1.95 -0.3" width="0.3" height="0.7" depth="0.3" color="#9B5DE5" shadow></a-box>
    <a-box position="-0.6 2.3 -0.3" width="0.38" height="0.08" depth="0.38" color="#7209B7" shadow></a-box>

  </a-entity>
</a-scene>
</body>
</html>
